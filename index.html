<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elle Fitwear</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Elle Fitwear</h1>
    <div class="cart-icon" onclick="toggleCart()">🛒</div>
</header>

<section class="products" id="products">
    <div class="product">
        <img src="img/conjunto marrom.jpg" alt="conjunto marrom">
        <h3>Conjunto marrom</h3>
        <p>R$ 79,90</p>
        <button onclick="addToCart('conjunto marrom', 79.90)">Adicionar ao carrinho</button>
    </div>
    <div class="product">
        <img src="img/conjunto preto.jpg" alt="conjunto preto">
        <h3>Conjunto Preto</h3>
        <p>R$ 119,90</p>
        <button onclick="addToCart('conjunto preto', 119.90)">Adicionar ao carrinho</button>
    </div>
    <div class="product">
        <img src="img/conjunto.jpg" alt="conjunto">
        <h3>Conjunto</h3>
        <p>R$ 89,90</p>
        <button onclick="addToCart('conjunto', 89.90)">Adicionar ao carrinho</button>
    </div>

    <!-- Novos produtos -->
    <div class="product">
        <img src="img/macacão.jpg" alt="macacão">
        <h3>Macacão</h3>
        <p>R$ 199,90</p>
        <button onclick="addToCart('macacão', 199.90)">Adicionar ao carrinho</button>
    </div>

    <div class="product">
        <img src="img/macaquinho  (1).jpg" alt="macaquinho">
        <h3>Macaquinho</h3>
        <p>R$ 69,90</p>
        <button onclick="addToCart('macaquinho', 69.90)">Adicionar ao carrinho</button>
    </div>

    <div class="product">
        <img src="img/macaquinho marrom.jpg" alt="macaquinho marrom">
        <h3>Macaquinho Marrom </h3>
        <p>R$ 149,90</p>
        <button onclick="addToCart('macaquinho marrom', 149.90)">Adicionar ao carrinho</button>
    </div>
</section>

<div class="cart" id="cart">
    <h2>Seu Carrinho</h2>
    <ul id="cart-items"></ul>
    <p>Total: R$ <span id="total">0.00</span></p>
    <button onclick="checkout()">Finalizar Compra</button>
</div>

<script src="js/script.js"></script>
</body>
</html>
