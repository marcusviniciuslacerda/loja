<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elle Fitwear</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Elle Fitwear</h1>
    <div class="cart-icon" onclick="toggleCart()">🛒</div>
</header>

<section class="products" id="products">
    <div class="product">
        <img src="img/produtos/top-fitness.jpg" alt="Top Fitness">
        <h3>Top Fitness</h3>
        <p>R$ 79,90</p>
        <button onclick="addToCart('Top Fitness', 79.90)">Adicionar ao carrinho</button>
    </div>
    <div class="product">
        <img src="img/produtos/legging-flex.jpg" alt="Legging Flex">
        <h3>Legging Flex</h3>
        <p>R$ 119,90</p>
        <button onclick="addToCart('Legging Flex', 119.90)">Adicionar ao carrinho</button>
    </div>
    <div class="product">
        <img src="img/produtos/cropped-power.jpg" alt="Cropped Power">
        <h3>Cropped Power</h3>
        <p>R$ 89,90</p>
        <button onclick="addToCart('Cropped Power', 89.90)">Adicionar ao carrinho</button>
    </div>

    <!-- Novos produtos -->
    <div class="product">
        <img src="img/produtos/conjunto-rose.jpg" alt="Conjunto Rose">
        <h3>Conjunto Rose</h3>
        <p>R$ 199,90</p>
        <button onclick="addToCart('Conjunto Rose', 199.90)">Adicionar ao carrinho</button>
    </div>

    <div class="product">
        <img src="img/shorts-preto.jpg" alt="Shorts Preto">
        <h3>Shorts Preto</h3>
        <p>R$ 69,90</p>
        <button onclick="addToCart('Shorts Preto', 69.90)">Adicionar ao carrinho</button>
    </div>

    <div class="product">
        <img src="img/jaqueta-fitness.jpg" alt="Jaqueta Fitness">
        <h3>Jaqueta Fitness</h3>
        <p>R$ 149,90</p>
        <button onclick="addToCart('Jaqueta Fitness', 149.90)">Adicionar ao carrinho</button>
    </div>
</section>

<div class="cart" id="cart">
    <h2>Seu Carrinho</h2>
    <ul id="cart-items"></ul>
    <p>Total: R$ <span id="total">0.00</span></p>
    <button onclick="checkout()">Finalizar Compra</button>
</div>

<script src="js/script.js"></script>
</body>
</html>
